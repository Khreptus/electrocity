name = "electrocity"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# Перед кожним деплоєм — тести розбору графіків. Якщо щось зламано, нова версія не потрапить на сайт.
[build]
command = "node --test tests/parsers.test.mjs"

[assets]
directory = "."
binding = "ASSETS"

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "7e3143dc488843b0bc9843b5ac13aebd"

[observability]
enabled = true
