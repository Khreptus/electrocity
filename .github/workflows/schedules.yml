name: Графіки відключень

on:
  # Решту графіків збирає Cloudflare Worker. Тут — лише ДТЕК Дніпро (Кривий Ріг),
  # бо його сайт не пускає сервери Cloudflare.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedules
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Зібрати графіки
        id: fetch
        run: node scripts/fetch-schedules.mjs dtek-dnem
      - name: Запасний варіант через браузер (якщо сайт блокує прості запити)
        if: steps.fetch.outputs.need_browser != ''
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          for op in ${{ steps.fetch.outputs.need_browser }}; do node scripts/fetch-schedules.mjs "$op" || true; done
      - name: Зберегти зміни
        run: |
          git config user.name "electrocity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/schedules/dtek-dnem.json data/addr
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "Оновлення графіків $(TZ=Europe/Kyiv date '+%d.%m %H:%M')"
          git pull --rebase origin main && git push
