name: Графіки відключень

on:
  # Решту графіків збирає Cloudflare Worker. Тут — сайти ДТЕК (Дніпро, Київ, Київщина, Донеччина),
  # бо вони не пускають сервери Cloudflare.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedules
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Зібрати графіки
        id: fetch
        run: node scripts/fetch-schedules.mjs dtek-dnem dtek-krem dtek-dem
      - name: Запасний варіант через браузер (якщо сайт блокує прості запити)
        if: steps.fetch.outputs.need_browser != ''
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          for op in ${{ steps.fetch.outputs.need_browser }}; do node scripts/fetch-schedules.mjs "$op" || true; done
      # Аварії за адресою на сайтах ДТЕК: черга вулиць від сервера → getHomeNum → результат серверу.
      # Обмін захищено секретом DTEK_KEY (той самий у GitHub Secrets і в Cloudflare Worker). Адреси не потрапляють у репозиторій.
      - name: Перевірити адреси на сайтах ДТЕК
        id: addr
        env:
          DTEK_KEY: ${{ secrets.DTEK_KEY }}
        run: node scripts/dtek-addr.mjs || true
      - name: Перевірити адреси ДТЕК через браузер
        if: steps.addr.outputs.need_browser_addr != ''
        env:
          DTEK_KEY: ${{ secrets.DTEK_KEY }}
          ONLY_OPS: ${{ steps.addr.outputs.need_browser_addr }}
        run: |
          [ -d node_modules/playwright ] || npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/dtek-addr.mjs --browser || true
      - name: Зберегти зміни
        run: |
          git config user.name "electrocity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/schedules data/addr
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "Оновлення графіків $(TZ=Europe/Kyiv date '+%d.%m %H:%M')"
          git pull --rebase origin main && git push
