name: Довідники адрес обленерго

# Довідники «адреса → черга»: Хмельницькобленерго (офіційні xlsx), Чернівціобленерго (сторінки пошуку групи).
# Файли оновлюються рідко, тож перевіряємо раз на тиждень (і можна запустити вручну).
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hoe-addr
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Встановити xlsx
        run: npm i --no-save --no-audit --no-fund https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
      - name: Хмельницькобленерго
        run: node scripts/hoe-addr.mjs || echo "::warning::Хмельницькобленерго — не вдалося"
      - name: Чернівціобленерго
        run: node scripts/cv-addr.mjs || echo "::warning::Чернівціобленерго — не вдалося"
      - name: Зберегти зміни
        run: |
          git config user.name "electrocity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/addr/hoe data/addr/chernoe
          if git diff --cached --quiet; then echo "Без змін"; exit 0; fi
          git commit -m "Довідники адрес $(TZ=Europe/Kyiv date '+%d.%m.%Y')"
          git pull --rebase origin main && git push
