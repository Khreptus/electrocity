#pre{position:fixed;inset:0;z-index:100;background:#0F1012;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:24px;overflow:hidden;transition:opacity .45s ease,visibility .45s;font-family:Onest,system-ui,sans-serif}

#pre .glow{position:absolute;left:50%;top:62%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(circle,rgba(227,154,11,.42),rgba(227,154,11,.12) 40%,transparent 68%);opacity:0;animation:pGlow 2.4s ease forwards}
#pre .wire{stroke:#2C2E33;stroke-width:3;stroke-dasharray:1 1;stroke-dashoffset:1;animation:pWire .5s cubic-bezier(.3,.7,.3,1) forwards}
#pre .spark{stroke:#FFD48A;stroke-width:5;stroke-linecap:round;stroke-dasharray:.05 2;stroke-dashoffset:.05;opacity:0;filter:drop-shadow(0 0 6px #E39A0B) drop-shadow(0 0 14px rgba(227,154,11,.8));animation:pSpark .6s cubic-bezier(.55,0,.85,.4) .35s forwards}
#pre .dim{stroke:#2C2E33;stroke-width:7;stroke-miterlimit:16}
#pre .lit{stroke:#fff;stroke-width:7;stroke-miterlimit:16;stroke-dasharray:.5 1;stroke-dashoffset:.5;filter:drop-shadow(0 0 4px rgba(255,214,140,.9));animation:pTrace .55s cubic-bezier(.4,0,.2,1) .9s forwards}
#pre .amb{opacity:0;animation:pIgnite .6s linear 1.4s forwards}
#pre p{color:#F3F4F1;font-size:clamp(24px,6.4vw,30px);font-weight:700;line-height:1.25;letter-spacing:-.01em;text-align:center;opacity:0;transform:translateY(8px);animation:pText .5s ease 1.75s forwards}
@keyframes pWire{to{stroke-dashoffset:0}}
@keyframes pSpark{0%{opacity:1;stroke-dashoffset:.05}92%{opacity:1}100%{opacity:0;stroke-dashoffset:-.985}}
@keyframes pTrace{to{stroke-dashoffset:0;filter:drop-shadow(0 0 0 transparent)}}
@keyframes pIgnite{0%{opacity:0}12%{opacity:1}22%{opacity:.25}34%{opacity:1}44%{opacity:.55}60%,100%{opacity:1}}
@keyframes pGlow{0%,60%{opacity:0;transform:scale(.6)}75%{opacity:1;transform:scale(1.08)}100%{opacity:.8;transform:scale(1)}}
@keyframes pText{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#pre *{animation:none!important}#pre .wire,#pre .lit{stroke-dashoffset:0}#pre .amb,#pre p{opacity:1;transform:none}#pre .glow{opacity:.8}}
